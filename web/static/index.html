<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mapa Pokémon</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const initialLat = -31.770687426923516;
  const initialLng = -52.34135057529372;
  
  const map = L.map('map').setView([initialLat, initialLng], 17);
  
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19
  }).addTo(map);
  
  // ===== ÍCONES =====
  const icons = {
    player: L.icon({ iconUrl: "/static/Player.png", iconSize: [20, 20] }),
    pokestop_active: L.icon({ iconUrl: "/static/Pokestop.png", iconSize: [20, 20] }),
    pokestop_inactive: L.icon({ iconUrl: "/static/Pokestop_off.png", iconSize: [20, 20] })
  };
  
  const pokemonSprites = [
    "/static/pokemons/p0.png",
    "/static/pokemons/p01.png",
    "/static/pokemons/p02.png",
    "/static/pokemons/p03.png",
    "/static/pokemons/p04.png",
    "/static/pokemons/p05.png",
    "/static/pokemons/p06.png",
    "/static/pokemons/p07.png",
    "/static/pokemons/p08.png",
    "/static/pokemons/p09.png",
    "/static/pokemons/p10.png",
    "/static/pokemons/p11.png",
    "/static/pokemons/p12.png",
    "/static/pokemons/p13.png",
    "/static/pokemons/p14.png",
    "/static/pokemons/p15.png",
    "/static/pokemons/p16.png",
    "/static/pokemons/p17.png",
    "/static/pokemons/p18.png",
    "/static/pokemons/p19.png",
    "/static/pokemons/p20.png",
    "/static/pokemons/p21.png",
    "/static/pokemons/p22.png",
    "/static/pokemons/p23.png",
    "/static/pokemons/p24.png",
    "/static/pokemons/p25.png",
    "/static/pokemons/p26.png",
    "/static/pokemons/p27.png",
    "/static/pokemons/p28.png",
    "/static/pokemons/p29.png",
    "/static/pokemons/p30.png",
  ];
  
  // ===== MARKERS COM ESTADO =====
  const markers = new Map();
  
  /*
  {
    marker,
    currentLat,
    currentLng,
    targetLat,
    targetLng
  }
  */
  
  const SMOOTHING = 0.12;
  
  // 🔁 LOOP DE ANIMAÇÃO
  function animate() {
    markers.forEach(data => {
      data.currentLat += (data.targetLat - data.currentLat) * SMOOTHING;
      data.currentLng += (data.targetLng - data.currentLng) * SMOOTHING;
  
      data.marker.setLatLng([data.currentLat, data.currentLng]);
    });
  
    requestAnimationFrame(animate);
  }
  
  animate();
  
  // ===== SSE =====
  const source = new EventSource("/stream");
  
  source.onmessage = function(event) {
    const data = JSON.parse(event.data);
    const activeIds = new Set();
  
    function updateEntity(id, lat, lng, icon) {
      activeIds.add(id);
  
      let dataMarker = markers.get(id);
  
      if (!dataMarker) {
        const marker = L.marker([lat, lng], { icon }).addTo(map);
  
        markers.set(id, {
          marker: marker,
          currentLat: lat,
          currentLng: lng,
          targetLat: lat,
          targetLng: lng
        });
  
      } else {
        dataMarker.targetLat = lat;
        dataMarker.targetLng = lng;
        dataMarker.marker.setIcon(icon);
      }
    }
  
    // ===== PLAYERS =====
    data.players.forEach(p => {
      updateEntity(
        p.id,
        p.pos.latitude,
        p.pos.longitude,
        icons.player
      );
    });
  
    // ===== POKEMONS =====
    data.pokemons.forEach(p => {
      const sprite = pokemonSprites[p.pokemon_type];
  
      const icon = L.icon({
        iconUrl: sprite,
        iconSize: [20, 20]
      });
  
      updateEntity(
        p.id,
        p.pos.latitude,
        p.pos.longitude,
        icon
      );
    });
  
    // ===== POKESTOPS =====
    data.pokestops.forEach(ps => {
      const icon = ps.pokestop_available
        ? icons.pokestop_active
        : icons.pokestop_inactive;
  
      updateEntity(
        ps.id,
        ps.pos.latitude,
        ps.pos.longitude,
        icon
      );
    });
  
    // 🧹 REMOVE INATIVOS
    markers.forEach((dataMarker, id) => {
      if (!activeIds.has(id)) {
        map.removeLayer(dataMarker.marker);
        markers.delete(id);
      }
    });
  };
  </script>

</body>
</html>
