<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mapa Pokémon</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const initialLat = -31.770687426923516;
const initialLng = -52.34135057529372;

const map = L.map('map').setView([initialLat, initialLng], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// ===== ÍCONES =====
const icons = {
  player: L.icon({ iconUrl: "/static/player.png", iconSize: [32, 32] }),
  pokemon: L.icon({ iconUrl: "/static/pokemon.png", iconSize: [32, 32] }),
  pokestop: L.icon({ iconUrl: "/static/pokestop.png", iconSize: [32, 32] })
};

const typeMap = ["player", "pokemon", "pokestop"];

const markers = new Map();

// ===== SSE =====
const source = new EventSource("/stream");

source.onmessage = function(event) {
  console.log(event.data);
  const entities = JSON.parse(event.data);

  entities.forEach(e => {
    const id = e.id;
    const lat = e.pos.latitude;
    const lng = e.pos.longitude;

    let marker = markers.get(id);

    const icon = icons[typeMap[e.type]];

    if (!marker) {
      marker = L.marker([lat, lng], { icon }).addTo(map);
      markers.set(id, marker);
    } else {
      marker.setLatLng([lat, lng]);
    }
  });
};
</script>

</body>
</html>
