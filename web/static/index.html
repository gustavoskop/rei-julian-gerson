<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mapa Pokémon</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const initialLat = -31.770687426923516;
const initialLng = -52.34135057529372;

const map = L.map('map').setView([initialLat, initialLng], 17);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community',
  maxZoom: 19
}).addTo(map);


const icons = {
  player: L.icon({ iconUrl: "/static//Player.png", iconSize: [26, 26] }),
  pokestop_active: L.icon({ iconUrl: "/static/Pokestop.png", iconSize: [26, 26] }),
  pokestop_inactive: L.icon({ iconUrl: "/static/Pokestop_off.png", iconSize: [26, 26] })
};

const typeMap = ["player", "pokemon", "pokestop"];

const pokemonSprites = [
  "/static/pokemons/p0.png",
  "/static/pokemons/p01.png",
  "/static/pokemons/p02.png",
  "/static/pokemons/p03.png",
  "/static/pokemons/p04.png",
  "/static/pokemons/p05.png",
  "/static/pokemons/p06.png",
  "/static/pokemons/p07.png",
  "/static/pokemons/p08.png",
  "/static/pokemons/p09.png",
  "/static/pokemons/p10.png",
  "/static/pokemons/p11.png",
  "/static/pokemons/p12.png",
  "/static/pokemons/p13.png",
  "/static/pokemons/p14.png",
  "/static/pokemons/p15.png",
  "/static/pokemons/p16.png",
  "/static/pokemons/p17.png",
  "/static/pokemons/p18.png",
  "/static/pokemons/p19.png",
  "/static/pokemons/p20.png",
  "/static/pokemons/p21.png",
  "/static/pokemons/p22.png",
  "/static/pokemons/p23.png",
  "/static/pokemons/p24.png",
  "/static/pokemons/p25.png",
  "/static/pokemons/p26.png",
  "/static/pokemons/p27.png",
  "/static/pokemons/p28.png",
  "/static/pokemons/p29.png",
  "/static/pokemons/p30.png",
];

const markers = new Map();


const source = new EventSource("/stream");

source.onmessage = function(event) {
  const data = JSON.parse(event.data);

  const activeIds = new Set();
  
  data.players.forEach(p => {
    const id = p.id;
    const lat = p.pos.latitude;
    const lng = p.pos.longitude;

    activeIds.add(id);

    let marker = markers.get(id);

    const icon = icons.player;

    if (!marker) {
      marker = L.marker([lat, lng], { icon }).addTo(map);
      markers.set(id, marker);
    } else {
      marker.setLatLng([lat, lng]);
    }
  });

  data.pokemons.forEach(p => {
    const id = p.id;
    const lat = p.pos.latitude;
    const lng = p.pos.longitude;

    activeIds.add(id);

    let marker = markers.get(id);

    const sprite = pokemonSprites[p.pokemon_type];

    const icon = L.icon({
      iconUrl: sprite,
      iconSize: [29, 29]
    });

    if (!marker) {
      marker = L.marker([lat, lng], { icon }).addTo(map);
      markers.set(id, marker);
    } else {
      marker.setLatLng([lat, lng]);
      marker.setIcon(icon);
    }
  });

  data.pokestops.forEach(ps => {
    const id = ps.id;
    const lat = ps.pos.latitude;
    const lng = ps.pos.longitude;

    activeIds.add(id);

    let marker = markers.get(id);

    const icon = ps.pokestop_available
      ? icons.pokestop_active
      : icons.pokestop_inactive;

    if (!marker) {
      marker = L.marker([lat, lng], { icon }).addTo(map);
      markers.set(id, marker);
    } else {
      marker.setLatLng([lat, lng]);
      marker.setIcon(icon);
    }
  });

  markers.forEach((marker, id) => {
    if (!activeIds.has(id)) {
      map.removeLayer(marker);
      markers.delete(id);
    }
  });
};
</script>

</body>
</html>
